<!DOCTYPE html>
<html>
<head>
    <title>Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 100px;
            background-color: #ffe6f0;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            margin: 20px;
            cursor: pointer;
        }
        #noBtn {
            position: absolute;
        }
    </style>
</head>
<body>

<h1>Rim Will you be my Valentine? 💖</h1>

<button onclick="yesClicked()">Yes ❤️</button>
<button id="noBtn" onmouseover="moveButton()">No 😢</button>

<script>
function yesClicked() {
    document.body.innerHTML = "<h1>Yayyyy! I love you ❤️🥰</h1>";
}

function moveButton() {
    let x = Math.random() * window.innerWidth;
    let y = Math.random() * window.innerHeight;
    document.getElementById('noBtn').style.left = x + 'px';
    document.getElementById('noBtn').style.top = y + 'px';
}
</script>

</body>
</html>
